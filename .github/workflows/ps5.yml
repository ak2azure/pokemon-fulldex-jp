name: PS5 payload
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ps5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake ninja-build python3 clang-18 lld-18 make wget unzip
          # ps5-payload-sdk with its libraries (SDL2 among them), as pacbrew-repo releases it.
          curl -fsSL -o /tmp/ps5-payload-dev.tar.gz \
            https://github.com/ps5-payload-dev/pacbrew-repo/releases/latest/download/ps5-payload-dev.tar.gz
          sudo tar -xzf /tmp/ps5-payload-dev.tar.gz -C /
      - name: Build
        run: bash tools/ps5/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: pokemon-fulldex-ps5
          path: build-ps5-dist/pokemon-fulldex-ps5.zip
